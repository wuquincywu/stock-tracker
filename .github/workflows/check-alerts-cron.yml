name: Trigger check-alerts cron

# Actual daily scheduling now lives on cron-job.org (Taipei 20:15, after institutional data
# publishes) — GitHub's own `schedule` event proved unreliable here: it went from never firing at
# all across three different cron times, to firing over 4 hours late the one time it did (see git
# history on this file). Kept only for manual on-demand runs (workflow_dispatch), e.g. to test
# after a code change without waiting for the next scheduled trigger.
on:
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/check-alerts
        run: |
          status=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://stock-tracker-gray-beta.vercel.app/api/cron/check-alerts")
          cat /tmp/body.txt
          if [ "$status" -ge 300 ]; then
            echo "check-alerts returned HTTP $status"
            exit 1
          fi
