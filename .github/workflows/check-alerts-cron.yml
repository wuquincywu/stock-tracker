name: Trigger check-alerts cron

# Vercel Hobby's own cron only guarantees per-hour precision (±59 min) — see README's "Push
# notifications" section. GitHub Actions' scheduler is tighter, so this calls the same endpoint
# Vercel's cron used to, from here instead. The minute is deliberately an odd one: GitHub delays
# or silently skips scheduled runs under load, and :00/:15/:30 are the most contended slots (the
# original 12:15 UTC never fired once).
on:
  schedule:
    - cron: "32 13 * * 1-5"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/check-alerts
        run: |
          status=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://stock-tracker-gray-beta.vercel.app/api/cron/check-alerts")
          cat /tmp/body.txt
          if [ "$status" -ge 300 ]; then
            echo "check-alerts returned HTTP $status"
            exit 1
          fi
