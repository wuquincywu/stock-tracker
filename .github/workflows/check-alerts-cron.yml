name: Trigger check-alerts cron

# Vercel Hobby's own cron only guarantees per-hour precision (±59 min) — see README's "Push
# notifications" section. GitHub Actions' scheduler is far tighter (typically within a couple of
# minutes, occasionally more during platform-wide load spikes at the top of the hour), so this
# calls the same endpoint Vercel's cron used to, at the same UTC time, from here instead.
on:
  schedule:
    - cron: "15 12 * * 1-5"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/check-alerts
        run: |
          status=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://stock-tracker-gray-beta.vercel.app/api/cron/check-alerts")
          cat /tmp/body.txt
          if [ "$status" -ge 300 ]; then
            echo "check-alerts returned HTTP $status"
            exit 1
          fi
